<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thanh toán | Brian Luu</title>

    <!-- Fonts & Icons -->
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons+Round"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,1"
      rel="stylesheet"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css" />

    <style>
      :root {
        --checkout-bg: #f9fafb;
        --checkout-card: #ffffff;
        --checkout-border: #e5e7eb;
        --checkout-text: #1f2937;
        --checkout-text-light: #6b7280;
      }

      .dark-mode {
        --checkout-bg: #111827;
        --checkout-card: #1f2937;
        --checkout-border: #374151;
        --checkout-text: #f9fafb;
        --checkout-text-light: #9ca3af;
      }

      body {
        background-color: var(--checkout-bg);
        font-family: "Manrope", sans-serif;
      }

      .checkout-wrapper {
        max-width: 1400px;
        margin: 0 auto;
        padding: 40px 24px 100px;
      }

      .checkout-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 40px;
        flex-wrap: wrap;
        gap: 20px;
      }

      .checkout-logo h1 {
        font-family: "Playfair Display", serif;
        font-size: 2rem;
        font-style: italic;
        color: #064e3b;
      }

      .checkout-steps {
        display: flex;
        gap: 30px;
        background: var(--checkout-card);
        padding: 15px 30px;
        border-radius: 50px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
      }

      .step {
        display: flex;
        align-items: center;
        gap: 10px;
        opacity: 0.5;
      }

      .step.active {
        opacity: 1;
      }

      .step-number {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: #064e3b;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 14px;
      }

      .checkout-grid {
        display: grid;
        grid-template-columns: 1.5fr 1fr;
        gap: 40px;
      }

      @media (max-width: 968px) {
        .checkout-grid {
          grid-template-columns: 1fr;
        }
      }

      .checkout-form-section {
        background: var(--checkout-card);
        border-radius: 30px;
        padding: 40px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.03);
      }

      .form-title {
        font-family: "Playfair Display", serif;
        font-size: 1.8rem;
        font-style: italic;
        margin-bottom: 30px;
        color: #064e3b;
      }

      .form-card {
        background: rgba(6, 78, 59, 0.02);
        border-radius: 20px;
        padding: 30px;
        margin-bottom: 30px;
        border: 1px solid var(--checkout-border);
      }

      .form-card-header {
        display: flex;
        align-items: center;
        gap: 15px;
        margin-bottom: 25px;
      }

      .form-card-icon {
        width: 50px;
        height: 50px;
        border-radius: 15px;
        background: rgba(6, 78, 59, 0.1);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #064e3b;
        font-size: 24px;
      }

      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-bottom: 20px;
      }

      .form-group {
        margin-bottom: 20px;
      }

      .form-label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 8px;
        color: var(--checkout-text-light);
      }

      .form-input {
        width: 100%;
        padding: 14px 18px;
        border: 2px solid var(--checkout-border);
        border-radius: 16px;
        background: transparent;
        font-size: 15px;
        transition: all 0.3s;
        color: var(--checkout-text);
      }

      .form-input:focus {
        outline: none;
        border-color: #064e3b;
        box-shadow: 0 0 0 4px rgba(6, 78, 59, 0.1);
      }

      .order-summary-modern {
        background: var(--checkout-card);
        border-radius: 30px;
        padding: 40px;
        position: sticky;
        top: 120px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.03);
      }

      .cart-items-modern {
        max-height: 400px;
        overflow-y: auto;
        padding-right: 10px;
        margin-bottom: 30px;
      }

      .cart-item-modern {
        display: flex;
        gap: 20px;
        padding: 20px 0;
        border-bottom: 1px solid var(--checkout-border);
      }

      .cart-item-image {
        width: 80px;
        height: 80px;
        border-radius: 16px;
        overflow: hidden;
        background: #f2f0eb;
        flex-shrink: 0;
      }

      .cart-item-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .cart-item-name {
        font-weight: 700;
        font-size: 16px;
        margin-bottom: 5px;
      }

      .cart-item-price {
        font-weight: 700;
        color: #064e3b;
        font-size: 18px;
      }

      .qty-btn {
        width: 30px;
        height: 30px;
        border-radius: 10px;
        border: 1px solid var(--checkout-border);
        background: transparent;
        cursor: pointer;
      }

      .price-breakdown {
        background: rgba(6, 78, 59, 0.03);
        border-radius: 20px;
        padding: 25px;
        margin-bottom: 30px;
      }

      .price-row {
        display: flex;
        justify-content: space-between;
        padding: 12px 0;
        font-size: 15px;
      }

      .price-row.total {
        font-size: 20px;
        font-weight: 700;
        border-top: 2px dashed var(--checkout-border);
        margin-top: 12px;
        padding-top: 20px;
        color: #064e3b;
      }

      .payment-methods {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
        margin: 30px 0;
      }

      .payment-method {
        border: 2px solid var(--checkout-border);
        border-radius: 20px;
        padding: 20px 15px;
        text-align: center;
        cursor: pointer;
        transition: all 0.3s;
      }

      .payment-method:hover {
        border-color: #064e3b;
      }

      .payment-method.active {
        border-color: #064e3b;
        background: rgba(6, 78, 59, 0.05);
      }

      .place-order-btn {
        width: 100%;
        background: #064e3b;
        color: white;
        border: none;
        padding: 20px;
        border-radius: 30px;
        font-size: 18px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.3s;
        margin-top: 30px;
      }

      .place-order-btn:hover {
        background: #0a6e4f;
      }

      .empty-cart {
        text-align: center;
        padding: 60px 20px;
      }
    </style>
  </head>
  <body class="light-mode">
    <div class="checkout-wrapper">
      <div class="checkout-header">
        <div class="checkout-logo">
          <h1>Thanh toán</h1>
          <p>Hoàn tất đơn hàng của bạn</p>
        </div>
        <div class="checkout-steps">
          <div class="step active">
            <span class="step-number">1</span
            ><span class="step-text">Giỏ hàng</span>
          </div>
          <div class="step active">
            <span class="step-number">2</span
            ><span class="step-text">Thanh toán</span>
          </div>
          <div class="step">
            <span class="step-number">3</span
            ><span class="step-text">Hoàn tất</span>
          </div>
        </div>
      </div>

      <div class="checkout-grid" id="checkoutContent">
        <!-- JS sẽ fill vào đây -->
      </div>

      <div id="emptyCartMessage" style="display: none" class="empty-cart">
        <h2>Giỏ hàng trống</h2>
        <a href="index.html">Tiếp tục mua sắm</a>
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const cart = JSON.parse(localStorage.getItem("brianLuuCart")) || [];
        const checkoutContent = document.getElementById("checkoutContent");
        const emptyMessage = document.getElementById("emptyCartMessage");

        if (cart.length === 0) {
          checkoutContent.style.display = "none";
          emptyMessage.style.display = "block";
          return;
        }

        let subtotal = 0;
        let itemsHtml = "";

        cart.forEach((item, index) => {
          const price =
            parseFloat(item.price.replace(/[₫$,.]/g, "").trim()) || 0;
          const itemTotal = price * item.quantity;
          subtotal += itemTotal;

          itemsHtml += `
                    <div class="cart-item-modern">
                        <div class="cart-item-image">
                            <img src="images/${item.image || "default.jpg"}" alt="${item.name}">
                        </div>
                        <div class="cart-item-info">
                            <div class="cart-item-name">${item.name}</div>
                            <div class="cart-item-variant">${item.variant || "Tiêu chuẩn"}</div>
                            <div class="cart-item-price">${new Intl.NumberFormat("vi-VN").format(price)} ₫</div>
                            <div>
                                <button class="qty-btn" onclick="updateQty(${index}, -1)">−</button>
                                <span style="margin: 0 10px;">${item.quantity}</span>
                                <button class="qty-btn" onclick="updateQty(${index}, 1)">+</button>
                            </div>
                        </div>
                    </div>
                `;
        });

        checkoutContent.innerHTML = `
                <div class="checkout-form-section">
                    <h2 class="form-title">Thông tin giao hàng</h2>
                    
                    <div class="form-card">
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">Họ</label>
                                <input type="text" class="form-input" id="ho">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Tên</label>
                                <input type="text" class="form-input" id="ten">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Số điện thoại</label>
                            <input type="tel" class="form-input" id="phone">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-input" id="email">
                        </div>
                    </div>

                    <div class="form-card">
                        <div class="form-group">
                            <label class="form-label">Địa chỉ</label>
                            <input type="text" class="form-input" id="address">
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">Tỉnh/Thành</label>
                                <select class="form-input" id="city">
                                    <option>-- Chọn tỉnh/thành --</option>
                                    <option>Hồ Chí Minh</option>
                                    <option>Hà Nội</option>
                                    <option>Đà Nẵng</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="form-card">
                        <div style="display: flex; flex-direction: column; gap: 15px;">
                            <label style="display: flex; align-items: center; gap: 15px; padding: 20px; border: 2px solid var(--checkout-border); border-radius: 16px; cursor: pointer;">
                                <input type="radio" name="shipping" value="standard" checked style="width: 20px; height: 20px;">
                                <div style="flex: 1;">
                                    <strong>Giao hàng tiêu chuẩn</strong>
                                    <div style="font-size: 13px;">3-5 ngày làm việc</div>
                                </div>
                                <span style="font-weight: 700; color: #064e3b;">Miễn phí</span>
                            </label>
                            <label style="display: flex; align-items: center; gap: 15px; padding: 20px; border: 2px solid var(--checkout-border); border-radius: 16px; cursor: pointer;">
                                <input type="radio" name="shipping" value="express" style="width: 20px; height: 20px;">
                                <div style="flex: 1;">
                                    <strong>Giao hàng nhanh</strong>
                                    <div style="font-size: 13px;">1-2 ngày làm việc</div>
                                </div>
                                <span style="font-weight: 700; color: #064e3b;">+150.000đ</span>
                            </label>
                        </div>
                    </div>
                </div>

                <div class="order-summary-modern">
                    <h3>Đơn hàng của bạn</h3>
                    <div class="cart-items-modern">${itemsHtml}</div>
                    
                    <div class="price-breakdown">
                        <div class="price-row">
                            <span>Tạm tính</span>
                            <span id="subtotalDisplay">${new Intl.NumberFormat("vi-VN").format(subtotal)} ₫</span>
                        </div>
                        <div class="price-row">
                            <span>Phí vận chuyển</span>
                            <span id="shippingDisplay">Miễn phí</span>
                        </div>
                        <div class="price-row total">
                            <span>Tổng cộng</span>
                            <span id="totalDisplay">${new Intl.NumberFormat("vi-VN").format(subtotal)} ₫</span>
                        </div>
                    </div>

                    <div class="form-card">
                        <h4>Thanh toán</h4>
                        <div class="payment-methods">
                            <div class="payment-method active" onclick="selectPayment('credit')">
                                <div>Thẻ tín dụng</div>
                            </div>
                            <div class="payment-method" onclick="selectPayment('bank')">
                                <div>Chuyển khoản</div>
                            </div>
                            <div class="payment-method" onclick="selectPayment('cod')">
                                <div>COD</div>
                            </div>
                        </div>
                        <div id="paymentDetail" class="payment-detail">
                            <div class="form-group">
                                <label class="form-label">Số thẻ</label>
                                <input type="text" class="form-input" placeholder="1234 5678 9012 3456">
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label class="form-label">Ngày hết hạn</label>
                                    <input type="text" class="form-input" placeholder="MM/YY">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">CVV</label>
                                    <input type="text" class="form-input" placeholder="123">
                                </div>
                            </div>
                        </div>
                    </div>

                    <button class="place-order-btn" onclick="placeOrder()">ĐẶT HÀNG NGAY</button>
                </div>
            `;

        // XỬ LÝ PHÍ VẬN CHUYỂN
        const shippingRadios = document.querySelectorAll(
          'input[name="shipping"]',
        );
        const subtotalValue = subtotal;

        function updateShipping() {
          const selected = document.querySelector(
            'input[name="shipping"]:checked',
          );
          const shippingDisplay = document.getElementById("shippingDisplay");
          const totalDisplay = document.getElementById("totalDisplay");

          let shippingFee = 0;
          let shippingText = "Miễn phí";

          if (selected && selected.value === "express") {
            shippingFee = 150000;
            shippingText = "150.000 ₫";
          }

          shippingDisplay.textContent = shippingText;
          totalDisplay.textContent =
            new Intl.NumberFormat("vi-VN").format(subtotalValue + shippingFee) +
            " ₫";
        }

        shippingRadios.forEach((radio) => {
          radio.addEventListener("change", updateShipping);
        });

        updateShipping();
      });

      function selectPayment(type) {
        document
          .querySelectorAll(".payment-method")
          .forEach((el) => el.classList.remove("active"));
        event.currentTarget.classList.add("active");

        const paymentDetail = document.getElementById("paymentDetail");
        if (type === "credit") {
          paymentDetail.innerHTML = `
                    <div class="form-group"><label class="form-label">Số thẻ</label><input type="text" class="form-input" placeholder="1234 5678 9012 3456"></div>
                    <div class="form-row">
                        <div class="form-group"><label class="form-label">Ngày hết hạn</label><input type="text" class="form-input" placeholder="MM/YY"></div>
                        <div class="form-group"><label class="form-label">CVV</label><input type="text" class="form-input" placeholder="123"></div>
                    </div>
                `;
        } else if (type === "bank") {
          paymentDetail.innerHTML = `<div style="padding: 20px;">🏦 Vietcombank<br>📋 1234567890<br>👤 BRIAN LUU</div>`;
        } else {
          paymentDetail.innerHTML = `<div style="padding: 20px;">Thanh toán khi nhận hàng</div>`;
        }
      }

      function updateQty(index, change) {
        let cart = JSON.parse(localStorage.getItem("brianLuuCart")) || [];
        if (cart[index]) {
          cart[index].quantity += change;
          if (cart[index].quantity <= 0) cart.splice(index, 1);
          localStorage.setItem("brianLuuCart", JSON.stringify(cart));
          location.reload();
        }
      }

      function placeOrder() {
        const ho = document.getElementById("ho")?.value || "";
        const ten = document.getElementById("ten")?.value || "";
        const phone = document.getElementById("phone")?.value || "";
        const email = document.getElementById("email")?.value || "";
        const address = document.getElementById("address")?.value || "";
        const city = document.getElementById("city")?.value || "";

        if (
          !ho ||
          !ten ||
          !phone ||
          !email ||
          !address ||
          !city ||
          city === "-- Chọn tỉnh/thành --"
        ) {
          alert("Vui lòng nhập đầy đủ thông tin");
          return;
        }

        const cart = JSON.parse(localStorage.getItem("brianLuuCart")) || [];
        const subtotal = cart.reduce((sum, item) => {
          const price =
            parseFloat(item.price.replace(/[₫$,.]/g, "").trim()) || 0;
          return sum + price * item.quantity;
        }, 0);

        // Lấy phương thức vận chuyển
        const selectedShipping = document.querySelector(
          'input[name="shipping"]:checked',
        );
        const shippingMethod =
          selectedShipping?.value === "express"
            ? "Giao hàng nhanh"
            : "Giao hàng tiêu chuẩn";
        const shippingFee =
          selectedShipping && selectedShipping.value === "express" ? 150000 : 0;

        // ✅ LẤY PHƯƠNG THỨC THANH TOÁN - CÁCH ĐÚNG
        let paymentMethod = "COD"; // Mặc định

        const activePayment = document.querySelector(".payment-method.active");
        if (activePayment) {
          // Thử lấy text từ nhiều vị trí
          const paymentText =
            activePayment.querySelector(".payment-name")?.textContent ||
            activePayment.querySelector("div")?.textContent ||
            activePayment.textContent;

          if (paymentText) {
            // Chuẩn hóa text
            if (paymentText.includes("Thẻ") || paymentText.includes("credit")) {
              paymentMethod = "Thẻ tín dụng";
            } else if (
              paymentText.includes("Chuyển khoản") ||
              paymentText.includes("bank")
            ) {
              paymentMethod = "Chuyển khoản";
            } else if (
              paymentText.includes("COD") ||
              paymentText.includes("cod")
            ) {
              paymentMethod = "COD";
            } else {
              paymentMethod = paymentText.trim();
            }
          }
        }

        console.log("Payment method selected:", paymentMethod); // Debug

        const order = {
          id: "DH" + Date.now(),
          date: new Date().toLocaleString("vi-VN"),
          customer: {
            ho: ho,
            ten: ten,
            fullName: ho + " " + ten,
            phone: phone,
            email: email,
            address: address,
            city: city,
          },
          shippingMethod: shippingMethod,
          shippingFee: shippingFee,
          shippingAddress: address + ", " + city,
          paymentMethod: paymentMethod, // ✅ Đã lấy đúng
          items: cart,
          subtotal: subtotal,
          total: subtotal + shippingFee,
          status: "Đang xử lý",
        };

        let orders = JSON.parse(localStorage.getItem("brianLuuOrders")) || [];
        orders.push(order);
        localStorage.setItem("brianLuuOrders", JSON.stringify(orders));
        localStorage.removeItem("brianLuuCart");

        alert("✅ Đặt hàng thành công!");
        window.location.href = "theo-doi-don-hang.html?id=" + order.id;
      }
    </script>
  </body>
</html>
